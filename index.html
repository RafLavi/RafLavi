<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06132e">
<title>RafLavi World</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06132e;color:white;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.gold{background:linear-gradient(120deg,#fff1a3,#d68a19,#fff1a3);-webkit-background-clip:text;background-clip:text;color:transparent}
.screen{min-height:100dvh;padding:20px 16px 85px;background:radial-gradient(ellipse at top,#173967,#06132e 65%)}
.logo{text-align:center;margin:20px auto}
.orb{width:150px;height:150px;border-radius:50%;margin:auto;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 25%,#69c6ff,#06488f 42%,#020c2d 75%);box-shadow:0 0 24px #e8a83e}
.orb:before{content:"";position:absolute;width:175px;height:55px;border:5px solid #f6bd50;border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 13px #f6ae2d}
.orb span{font:bold italic 74px Georgia,serif;color:#ffdc78;text-shadow:2px 3px #8a4407,0 0 12px #ffc35c;z-index:1}
.logo h1{font:bold italic 39px Georgia,serif;margin:15px 0 5px;line-height:1.05}
.subtitle{color:#e5e7ee;text-align:center;line-height:1.5}
.panel{max-width:460px;margin:24px auto;padding:22px;border:1px solid #a87832;border-radius:23px;background:#071b3b}
.field{width:100%;padding:15px;margin:8px 0;border:1px solid #b48a4a;border-radius:12px;background:#0b2447;color:white}
.primary{width:100%;padding:15px;border:0;border-radius:30px;background:linear-gradient(#ffe7a0,#d9901a);color:#1c1609;font-weight:bold;margin:9px 0}
.secondary{width:100%;padding:13px;border:1px solid #dbab57;border-radius:30px;background:transparent;color:white;margin:6px 0}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:bold italic 24px Georgia,serif;color:#ffd274}
.round{border:1px solid #a57939;border-radius:50%;width:38px;height:38px;background:#10284c;color:#ffe0a2;font-size:20px}
.greeting{display:flex;align-items:center;justify-content:space-between;margin:25px 0}
.chip{padding:10px;border:1px solid #a57939;border-radius:22px;background:#10284c;color:white}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}
.tab{flex:1;min-width:92px;border:1px solid #ac7c35;border-radius:14px;background:#0e294d;color:white;padding:12px 5px}
.tab.active{background:linear-gradient(#ffe8a0,#d88c1b);color:#17120b}
.hero{height:280px;border:2px solid #d5a44d;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(160deg,#2366a0,#0b254a 60%,#d9984e);display:flex;align-items:center;justify-content:center;text-align:center}
.hero:before{content:"🌍";font-size:130px;opacity:.65}
.hero .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#06132e);padding:40px 10px 15px}
.play{border:2px solid white;border-radius:50%;width:60px;height:60px;background:#0008;color:white;font-size:25px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}
.tile{min-height:88px;border:1px solid #bc8b40;border-radius:15px;background:linear-gradient(140deg,#193b67,#07172e);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 2px;box-shadow:0 2px 9px #0008}
.tile span{font-size:27px}
.tile small{font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:#07152d;border-top:1px solid #bd8c43;display:flex;justify-content:space-around;padding:10px 0 max(10px,env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#f5d18b;font-size:11px}
nav b{display:block;font-size:23px;margin-bottom:4px}
.content{max-width:600px;margin:auto}
.section{margin-top:18px;padding:20px;border:1px solid #ab7d3c;border-radius:18px;background:#10284a}
.section h2{color:#ffd47d;margin-top:0}
a{color:#ffdb8a}
</style>
</head>
<body>
<section id="welcome" class="screen">
<div class="content">
<div class="logo">
<div class="orb"><span>RL</span></div>
<h1 class="gold">RafLavi<br>World</h1>
<p class="subtitle">Connecting people, ideas and opportunities around the world.</p>
</div>
<div class="panel">
<h2 style="text-align:center;color:#ffdc88">Welcome to RafLavi World</h2>
<input class="field" id="name" placeholder="Your name">
<input class="field" id="email" type="email" placeholder="Email address">
<input class="field" id="password" type="password" placeholder="Password">
<button class="primary" onclick="enter()">Create Free Account</button>
<button class="secondary" onclick="enter()">Log In</button>
<p style="text-align:center;font-size:13px">Explore a world of opportunities</p>
<select class="field" aria-label="Choose language">
<option>English</option><option>Romanian</option><option>German</option><option>French</option><option>Spanish</option>
</select>
</div>
</div>
</section>
<section id="home" class="screen hidden">
<div class="content">
<header class="top">
<div class="brand">🌐 RafLavi World</div>
<div><button class="round" onclick="show('Notifications')">♧</button> <button class="round" onclick="show('Search')">⌕</button> <button class="round" onclick="show('Menu')">☰</button></div>
</header>
<div class="greeting"><div>👩 <strong id="username">Welcome!</strong><br><small>Explore your world</small></div><button class="chip" onclick="show('Global')">🌐 Global⌄</button></div>
<div class="tabs">
<button class="tab active" onclick="show('For You')">🏠 For You</button>
<button class="tab" onclick="show('Following')">👥 Following</button>
<button class="tab" onclick="show('Trending')">🔥 Trending</button>
<button class="tab" onclick="show('Global')">🌐 Global</button>
</div>
<div class="hero"><div class="overlay"><button class="play" onclick="show('Videos')">▶</button><p>Discover stories from around the world</p></div></div>
<div class="tiles">
<button class="tile" onclick="show('Post')"><span>📹</span><small>Post</small></button>
<button class="tile" onclick="show('Live')"><span>📡</span><small>Live</small></button>
<button class="tile" onclick="show('Messages')"><span>💬</span><small>Messages</small></button>
<button class="tile" onclick="show('Friends')"><span>👥</span><small>Friends</small></button>
<button class="tile" onclick="show('Jobs')"><span>💼</span><small>Jobs</small></button>
<button class="tile" onclick="show('Housing')"><span>🏠</span><small>Housing</small></button>
<button class="tile" onclick="show('Services')"><span>🛠️</span><small>Services</small></button>
<button class="tile" onclick="show('Courses & Training')"><span>🎓</span><small>Courses</small></button>
<button class="tile" onclick="show('Translation')"><span>🌐</span><small>Translate</small></button>
<button class="tile" onclick="show('Communities')"><span>🤝</span><small>Community</small></button>
<button class="tile" onclick="show('Events')"><span>📅</span><small>Events</small></button>
<button class="tile" onclick="show('Safety & Privacy')"><span>🛡️</span><small>Safety</small></button>
</div>
<div id="detail" class="section hidden"><h2 id="detailTitle"></h2><p id="detailText"></p><button class="secondary" onclick="closeDetail()">Back to Home</button></div>
</div>
<nav>
<button onclick="closeDetail()"><b>🏠</b>Home</button>
<button onclick="show('Discover')"><b>🧭</b>Discover</button>
<button onclick="show('Create')"><b>➕</b>Create</button>
<button onclick="show('Videos')"><b>📹</b>Videos</button>
<button onclick="show('Profile')"><b>👤</b>Profile</button>
</nav>
</section>
<script>
function enter(){
const name=document.getElementById('name').value.trim();
document.getElementById('username').textContent=name||'Welcome!';
document.getElementById('welcome').classList.add('hidden');
document.getElementById('home').classList.remove('hidden');
window.scrollTo(0,0);
}
function show(title){
document.getElementById('detailTitle').textContent=title;
document.getElementById('detailText').textContent=title+' is part of the RafLavi World vision. This feature is not yet connected to a live service.';
document.getElementById('detail').classList.remove('hidden');
document.getElementById('detail').scrollIntoView({behavior:'smooth'});
}
function closeDetail(){
document.getElementById('detail').classList.add('hidden');
window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
